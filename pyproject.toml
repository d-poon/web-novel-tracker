[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "web-novel-tracker"
version = "0.1.0"
description = "CLI tool for tracking web novels"
requires-python = ">=3.11"

dependencies = [
    "typer>=0.9",
    "pydantic>=2.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff"
]

[tool.pytest.ini_options]
minversion = "9.0.0"
testpaths = ["tests"]
addopts = [
    "-s",
    "--tb=short",
    "--cov=novel_tracker",
    "--cov-report=term-missing",
    "--cov-fail-under=80"
]

[tool.coverage.run]
source = ["novel_tracker"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[project.scripts]
novel-tracker = "novel_tracker.cli.app:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["venv", "__pycache__", "*.db", "*.log"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"